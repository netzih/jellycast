name: JellyCast
options:
  bundleIdPrefix: com.yitzchokwagner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Team id is the signing certificate's OU, not the user id in its CN.
    # Automatic signing is for building from the Xcode GUI; ./install.sh signs
    # by hand against the existing wildcard profile and needs no Xcode account.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N484MY8AUM
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  JellyCast:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
    dependencies:
      # Google Cast ships no SPM package; this is Google's official 4.8.6 xcframework.
      - framework: Vendor/GoogleCast.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yitzchokwagner.jellycast
        CODE_SIGN_ENTITLEMENTS: JellyCast.entitlements
        PRODUCT_NAME: JellyCast
        INFOPLIST_FILE: Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
